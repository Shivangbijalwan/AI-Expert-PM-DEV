<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>FINTA</title>
  </head>

  <body>
    <nav class="border-2 border-black m-2 p-4 rounded-lg">
      <div class="max-w-7xl mx-auto flex items-center justify-between">

        <!-- Logo -->
        <a
          href="#"
          class="text-2xl sm:text-3xl font-bold text-blue-900"
        >
          FINTA
        </a>

        <!-- Desktop Menu -->
        <div class="hidden md:flex items-center gap-6 lg:gap-10">
          <a
            href="#"
            class="font-bold text-blue-800 hover:text-blue-950 transition-colors"
          >
            Home
          </a>

          <a
            href="#"
            class="font-bold text-blue-800 hover:text-blue-950 transition-colors"
          >
            About
          </a>

          <a
            href="#"
            class="font-bold text-blue-800 hover:text-blue-950 transition-colors"
          >
            Contact
          </a>

          <a
            href="#"
            class="font-bold text-blue-800 hover:text-blue-950 transition-colors"
          >
            Footer
          </a>
        </div>

        <!-- Sign In -->
        <button
          class="hidden sm:block bg-blue-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-600 transition-colors"
        >
          Sign In
        </button>

        <!-- Mobile Menu Button -->
        <button
          id="menuBtn"
          class="md:hidden p-2 text-blue-900"
          aria-label="Open menu"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-7 h-7"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
          
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>
      </div>

      <!-- Mobile Menu -->
      <div
        id="mobileMenu"
        class="hidden md:hidden mt-4 border-t border-gray-300 pt-4"
      >
        <div class="flex flex-col gap-4">

          <a
            href="#"
            class="font-bold text-blue-800 hover:text-blue-950"
          >
            Home
          </a>

          <a
            href="#"
            class="font-bold text-blue-800 hover:text-blue-950"
          >
            About
          </a>

          <a
            href="#"
            class="font-bold text-blue-800 hover:text-blue-950"
          >
            Contact
          </a>

          <a
            href="#"
            class="font-bold text-blue-800 hover:text-blue-950"
          >
            Footer
          </a>

          <button
            class="bg-blue-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-600 w-full"
          >
            Sign In
          </button>

        </div>
      </div>
    </nav>
    <script src="script.js"></script>
  </body>
</html>
